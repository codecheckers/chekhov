# Quotes by Anton Chekhov, for the `thanks` command.
#
# Taken from the "Quotes" section of the Wikiquote page named below, revision
# 3950770 of 9 June 2026, which is CC BY-SA 4.0: every reply links back to the
# page, which is the attribution. Converted once and edited by hand since - it
# is the source of truth, not a copy that gets refreshed, so a quote that reads
# badly as a reply can simply be deleted.
#
# The long narrative passages the page also quotes - whole paragraphs from the
# stories - were left out: a reply to "thanks" is read in passing.
#
# text and work are required; year and detail (an act, a chapter, the date of a
# letter) are written where the page gives them.
source: https://en.wikiquote.org/wiki/Anton_Chekhov
revision: 3950770
licence: CC BY-SA 4.0
quotes:
- text: 'When a person is born, he can embark on only one of three roads of life: if you go right, the wolves will eat you; if you go left, you’ll eat the wolves; if you go straight, you’ll eat yourself.'
  work: Fatherlessness or Platonov
  year: 1878
  detail: Act I, sc. xiv
- text: That can not possibly be, because it could never possibly be.
  work: Letter to a Learned Neighbor
  year: 1880
- text: Eyes—the head’s chief of police. They watch and make mental notes. A blind person is like a city abandoned by the authorities. On sad days they cry. In these carefree times they weep only from tender emotions.
  work: A Brief Human Anatomy
  year: 1883
- text: We live not in order to eat, but in order not to know what we feel like eating.
  work: The Fruits of Long Meditations
  year: 1884
- text: Better a debauched canary than a pious wolf.
  work: Innocuous Thoughts
  year: 1885
- text: If only one tooth aches, rejoice that not all of them ache.... If your wife betrays you, be glad that she betrayed only you and not the nation.
  work: Life is Wonderful (For those attempting suicide)
  year: 1885
- text: Love is a scandal of the personal sort.
  work: The Piano Player
  year: 1885
- text: 'Once you’ve married, be strict but just with your wife, don’t allow her to forget herself, and when a misunderstanding arises, say: “Don’t forget that I made you happy.”'
  work: Guide for Those Wishing to Marry
  year: 1885
- text: By nature servile, people attempt at first glance to find signs of good breeding in the appearance of those who occupy more exalted stations.
  work: A Futile Occurrence or A Trivial Incident
  year: 1886
- text: Watching a woman make Russian pancakes, you might think that she was calling on the spirits or extracting from the batter the philosopher’s stone.
  work: Russian Pancakes or Bliny
  year: 1886
- text: 'A fiancé is neither this nor that: he’s left one shore, but not yet reached the other.'
  work: Love
  year: 1886
- text: Only during hard times do people come to understand how difficult it is to be master of their feelings and thoughts.
  work: Misfortune
  year: 1886
- text: I myself smoke, but my wife asked me to speak today on the harmfulness of tobacco, so what can I do? If it’s tobacco, then let it be tobacco.
  work: On the Harmfulness of Tobacco
  year: 1886
- text: The thirst for powerful sensations takes the upper hand both over fear and over compassion for the grief of others.
  work: An Evil Night
  year: 1886
- text: Probably nature itself gave man the ability to lie so that in difficult and tense moments he could protect his nest, just as do the vixen and wild duck.
  work: Difficult People
  year: 1886
- text: 'Faith is an aptitude of the spirit. It is, in fact, a talent: you must be born with it.'
  work: On the Road
  year: 1886
- text: It is depressing to hear the unfortunate or dying man jest.
  work: On the Road
  year: 1886
- text: 'Silence accompanies the most significant expressions of happiness and unhappiness: those in love understand one another best when silent, while the most heated and impassioned speech at a graveside touches only outsiders, but seems cold and inconsequential to the widow and children of the deceased.'
  work: Enemies
  year: 1887
- text: The unhappy are egotistical, base, unjust, cruel, and even less capable of understanding one another than are idiots. Unhappiness does not unite people, but separates them...
  work: Enemies
  year: 1887
- text: Each of us is full of too many wheels, screws and valves to permit us to judge one another on a first impression or by two or three external signs.
  work: Ivanov
  year: 1887
  detail: Act III, sc. vi
- text: Country acquaintances are charming only in the country and only in the summer. In the city in winter they lose half of their appeal.
  work: The Story of Mme. NN or Lady N—'s Story or A Lady's Story
  year: 1887
- text: One can prove or refute anything at all with words. Soon people will perfect language technology to such an extent that they’ll be proving with mathematical precision that twice two is seven.
  work: Lights
  year: 1888
- text: 'You look at any poetic creature: muslin, ether, demigoddess, millions of delights; then you look into the soul and find the most ordinary crocodile!'
  work: The Bear or The Boor, sc. viii
  year: 1888
- text: If you can’t distinguish people from lap-dogs, you shouldn’t undertake philanthropic work.
  work: The Princess
  year: 1889
- text: The sea has neither meaning nor pity.
  work: Gusev
  year: 1890
- text: Everyone has the same God; only people differ.
  work: The Duel
  year: 1891
- text: It is not only the prisoners who grow coarse and hardened from corporeal punishment, but those as well who perpetrate the act or are present to witness it.
  work: A Journey to Sakhalin
  year: 1891
- text: No matter how corrupt and unjust a convict may be, he loves fairness more than anything else. If the people placed over him are unfair, from year to year he lapses into an embittered state characterized by an extreme lack of faith.
  work: A Journey to Sakhalin
  year: 1891
- text: There is something beautiful, touching and poetic when one person loves more than the other, and the other is indifferent.
  work: After the Theatre
  year: 1892
- text: To regard one’s immortality as an exchange of matter is as strange as predicting the future of a violin case once the expensive violin it held has broken and lost its worth.
  work: Ward No. 6, ch. 7
  year: 1892
- text: Life is a vexatious trap; when a thinking man reaches maturity and attains to full consciousness he cannot help feeling that he is in a trap from which there is no escape.
  work: Ward No. 6
  year: 1892
- text: It’s even pleasant to be sick when you know that there are people who await your recovery as they might await a holiday.
  work: The Story of an Unknown Man or An Anonymous Story, ch. 15
  year: 1893
- text: There is nothing more awful, insulting, and depressing than banality.
  work: The Teacher of Literature
  year: 1894
- text: 'Death can only be profitable: there’s no need to eat, drink, pay taxes, offend people, and since a person lies in a grave for hundreds or thousands of years, if you count it up the profit turns out to be enormous.'
  work: Rothschild’s Fiddle
  year: 1894
- text: Moscow is a city that has much suffering ahead of it.
  work: Three Years
  year: 1895
- text: By poeticizing love, we imagine in those we love virtues that they often do not possess; this then becomes the source of constant mistakes and constant distress.
  work: Ariadne
  year: 1895
- text: Good breeding doesn't mean that you won't spill sauce on the tablecloth, but that you won't notice when someone else does.
  work: The House with the Mezzanine
  year: 1896
- text: It seems to me that all of the evil in life comes from idleness, boredom, and psychic emptiness, but all of that is inevitable when you become accustomed to living at others’ expense.
  work: My Life
  year: 1896
- text: Exquisite nature, daydreams, and music say one thing, real life another.
  work: In a Native Corner or At Home
  year: 1897
- text: All of life and human relations have become so incomprehensibly complex that, when you think about it, it becomes terrifying and your heart stands still.
  work: In the Cart or A Journey by Cart or The Schoolmistress
  year: 1897
- text: Who keeps the tavern and serves up the drinks? The peasant. Who squanders and drinks up money belonging to the peasant commune, the school, the church? The peasant. Who would steal from his neighbor, commit arson, and falsely denounce another for a bottle of vodka? The peasant.
  work: Peasants
  year: 1897
- text: There are no small number of people in this world who, solitary by nature, always try to go back into their shell like a hermit crab or a snail.
  work: The Man in a Case
  year: 1898
- text: People who live alone always have something on their minds that they would willingly share.
  work: About Love
  year: 1898
- text: It is uncomfortable to ask condemned people about their sentences just as it is awkward to ask wealthy people why they need so much money, why they use their wealth so poorly, and why they don’t just get rid of it when they recognize that it is the cause of their unhappiness.
  work: Episode from a Practice or A Doctor's Visit
  year: 1898
- text: If you really think about it, everything is wonderful in this world, everything except for our thoughts and deeds when we forget about the loftier goals of existence, about our human dignity.
  work: The Lady with the Dog
  year: 1899
- text: Dear, sweet, unforgettable childhood! Why does this irrevocable time, forever departed, seem brighter, more festive and richer than it actually was?
  work: The Bishop
  year: 1902
- text: Thought and beauty, like a hurricane or waves, should not know conventional, delimited forms.
  work: A Letter
  detail: uncertain date, story not published by Chekhov
- text: If in the first act you have hung a pistol on the wall, then in the following one it should be fired. Otherwise don't put it there."
  work: 'Ilia Gurliand Reminiscences of A. P. Chekhov, in Театр и искусство (Teatr i Iskusstvo, literally: Theater and art review) 1904, No 28, 11 July, p. 521. commonly known as Chekhov''s dictum or Chekhov''s gun.'
  year: 1904
- text: Mankind has conceived history as a series of battles; hitherto it has considered fighting as the main thing in life.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: The desire to serve the common good must without fail be a requisite of the soul, a necessity for personal happiness; if it issues not from there, but from theoretical or other considerations, it is not at all the same thing.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Solomon made a great mistake when he asked for wisdom.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Ordinary hypocrites pretend to be doves; political and literary hypocrites pretend to be eagles. But don't be disconcerted by their aquiline appearance. They are not eagles, but rats or dogs.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: It always seems to the brothers and the father that their brother or son didn't marry the right person.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Love is a great thing. It is not by chance that in all times and practically among all cultured peoples love in the general sense and the love of a man for his wife are both called love. If love is often cruel or destructive, the reason lies not in love itself, but in the inequality between people.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: A nice man would feel ashamed even before a dog.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: There is no national science, just as there is no national multiplication table; what is national is no longer science.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: How pleasant it is to respect people! When I see books, I am not concerned with how the authors loved or played cards; I see only their marvelous works.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: I observed that after marriage people cease to be curious.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: The more refined the more unhappy.
  work: Note-Book of Anton Chekhov
  year: 1921
  detail: 'Alernate translation: The more cultured a man, the less fortunate he is.'
- text: People love talking of their diseases, although they are the most uninteresting things in their lives.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Love, friendship, respect, do not unite people as much as a common hatred for something.
  work: Note-Book of Anton Chekhov
  year: 1921
  detail: 'Also quoted in Psychologically Speaking: A Book of Quotations, Kevin Connolly and Margaret Martlew, 1999, p. 96'
- text: It is easier to ask of the poor than of the rich.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Death is terrible, but still more terrible is the feeling that you might live for ever and never die.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: 'They say: "In the long run truth will triumph;" but it is untrue.'
  work: Note-Book of Anton Chekhov
  year: 1921
- text: When an actor has money, he doesn't send letters but telegrams.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Better to perish from fools than to accept praises from them.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: If you are afraid of loneliness, do not marry.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Although you may tell lies, people will believe you, if only you speak with authority.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: As I shall lie in the grave alone, so in fact I live alone.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Our self-esteem and conceit are European, but our culture and actions are Asiatic.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Man will only become better when you make him see what he is like.
  work: Note-Book of Anton Chekhov
  year: 1921
  detail: 'Alternate translation: Man will become better when you show him what he is like.'
- text: How intolerable people are sometimes who are happy and successful in everything.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: When one longs for a drink, it seems as though one could drink a whole ocean—that is faith; but when one begins to drink, one can only drink altogether two glasses—that is science.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: If you wish women to love you, be original; I know a man who used to wear felt boots summer and winter, and women fell in love with him.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: 'We fret ourselves to reform life, in order that posterity may be happy, and posterity will say as usual: "In the past it used to be better, the present is worse than the past."'
  work: Note-Book of Anton Chekhov
  year: 1921
  detail: 'Alternate translation: We go to great pains to alter life for the happiness of our descendants and our descendants will say as usual: things used to be so much better, life today is worse than it used to be.'
- text: Nothing lulls and inebriates like money; when you have a lot, the world seems a better place than it actually is.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: There is not a single criterion which can serve as the measure of the non-existent, of the non-human.
  work: Note-Book of Anton Chekhov
  year: 1921
  detail: 'Alternate translation: Not one of our mortal gauges is suitable for evaluating non-existence, for making judgments about that which is not a person.'
- text: It is unfortunate that we try to solve the simplest questions cleverly, and therefore make them unusually complicated. We should seek a simple solution.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: There is no Monday which will not give its place to Tuesday.
  work: Note-Book of Anton Chekhov
  year: 1921
- text: Do you know when you may concede your insignificance? In front of God or, perhaps, in front of the intellect, beauty, or nature, but not in front of people. Among people, one must be conscious of one’s dignity.
  work: Letter to his brother, M.P. Chekhov
  year: 1879
  detail: April 1879
- text: A grimy fly can soil the entire wall and a small, dirty little act can ruin the entire proceedings.
  work: Letter to A.N. Kanaev
  year: 1883
  detail: March 26, 1883
- text: Isolation in creative work is an onerous thing. Better to have negative criticism than nothing at all.
  work: Letter to his brother, A.P. Chekhov
  year: 1886
  detail: May 10, 1886
- text: When in a serious mood, it seems to me that those people are illogical who feel an aversion toward death. As far as I can see, life consists exclusively of horrors, unpleasantnesses and banalities, now merging, now alternating.
  work: Letter to M.V. Kiseleva
  year: 1886
  detail: September 29, 1886
- text: To describe drunkenness for the colorful vocabulary is rather cynical. There is nothing easier than to capitalize on drunkards.
  work: Letter to N.A. Leikin
  year: 1886
  detail: December 24, 1886
- text: There are people whom even children’s literature would corrupt. They read with particular enjoyment the piquant passages in the Psalter and in the Wisdom of Solomon.
  work: Letter to M.V. Kiseleva
  year: 1887
  detail: January 14, 1887
- text: Despite your best efforts, you could not invent a better police force for literature than criticism and the author’s own conscience.
  work: Letter to M.V. Kiseleva (January 14, 1887
  year: 1887
- text: Oh, what women are here!
  work: Letter to N. A. Leykin (April 7, 1887), from Taganrog
  year: 1887
- text: Tell me, pleez, my sawl, when will I live in human way, that is, to work and not to be in need? Now I work, and I'm in need, and I spoil my reputation by the need to write bullshit.
  work: Letter to the Alexander Chekhov
  year: 1887
  detail: April 14, 1887
- text: I was so drunk the whole time that I took bottles for girls and girls for bottles.
  work: Letter to the Chekhov family
  year: 1887
  detail: April 25, 1887
- text: You ask that I remove you from the list of my relatives; I willingly comply, especially since our relationship has always compromised me in the eyes of society. From now on, you will be known not as Chekhov, but as Ivan Mikhailovich Shevyrev.
  work: Letter to the Alexander Chekhov
  year: 1887
  detail: June 21, 1887
- text: Writers are as jealous as pigeons.
  work: Letter to I.L. Leontev
  year: 1888
  detail: February 4, 1888
- text: In Western Europe people perish from the congestion and stifling closeness, but with us it is from the spaciousness.... The expanses are so great that the little man hasn’t the resources to orient himself.... This is what I think about Russian suicides.
  work: Letter to D.V. Grigorovich
  year: 1888
  detail: February 5, 1888
- text: Happiness does not await us all. One needn’t be a prophet to say that there will be more grief and pain than serenity and money. That is why we must hang on to one another.
  work: Letter to K.S. Barantsevich
  year: 1888
  detail: March 3, 1888
- text: Tsars and slaves, the intelligent and the obtuse, publicans and pharisees all have an identical legal and moral right to honor the memory of the deceased as they see fit, without regard for anyone else’s opinion and without the fear of hindering one another.
  work: Letter to K.S. Barantsevich
  year: 1888
  detail: March 30, 1888
- text: Hypocrisy is a revolting, psychopathic state.
  work: Letter to I.L. Leontev
  year: 1888
  detail: August 29, 1888
- text: One must speak about serious things seriously.
  work: Letter to A.N. Pleshcheev
  year: 1888
  detail: September 9, 1888
- text: I don’t know why one can’t chase two rabbits at the same time, even in the literal sense of those words. If you have the hounds, go ahead and pursue.
  work: Letter to A.S. Suvorin
  year: 1888
  detail: September 11, 1888
- text: The more simply we look at ticklish questions, the more placid will be our lives and relationships.
  work: Letter to his brother, A.P. Chekhov
  year: 1888
  detail: September 24, 1888
- text: I would like to be a free artist and nothing else, and I regret God has not given me the strength to be one.
  work: Letter to Alexei Pleshcheev
  year: 1888
  detail: October 4, 1888
- text: My holy of holies is the human body, health, intelligence, talent, inspiration, love, and the most absolute freedom imaginable, freedom from violence and lies, no matter what form the latter two take. Such is the program I would adhere to if I were a major artist.
  work: Letter to Alexei Pleshcheev
  year: 1888
  detail: October 4, 1888
- text: Lying is the same as alcoholism. Liars prevaricate even on their deathbeds.
  work: Letter to A.N. Pleshcheev
  year: 1888
  detail: October 9, 1888
- text: There should be more sincerity and heart in human relations, more silence and simplicity in our interactions. Be rude when you’re angry, laugh when something is funny, and answer when you’re asked.
  work: Letter to his brother, A.P. Chekhov
  year: 1888
  detail: October 13, 1888
- text: He who doesn’t know how to be a servant should never be allowed to be a master; the interests of public life are alien to anyone who is unable to enjoy others’ successes, and such a person should never be entrusted with public affairs.
  work: Letter to A.N. Pleshcheev
  year: 1888
  detail: October 25, 1888
- text: It is a poor thing for the writer to take on that which he doesn’t understand.
  work: Letter to A.S. Suvorin
  year: 1888
  detail: October 27, 1888
- text: 'You are right to demand that an artist engage his work consciously, but you confuse two different things: solving the problem and correctly posing the question.'
  work: Letter to A.S. Suvorin
  year: 1888
  detail: October 27, 1888
- text: I have in my head a whole army of people pleading to be let out and awaiting my commands.
  work: Letter to A.S. Suvorin
  year: 1888
  detail: October 27, 1888
- text: I don’t care for success. The ideas sitting in my head are annoyed by, and envious of, that which I’ve already written.
  work: Letter to A.S. Suvorin
  year: 1888
  detail: October 27, 1888
- text: We learn about life not from pluses alone, but from minuses as well.
  work: Letter to A.S. Suvorin
  year: 1888
  detail: December 23, 1888
- text: 'It doesn’t matter that your painting is small. Kopecks are also small, but when a lot are put together they make a ruble. Each painting displayed in a gallery and each good book that makes it into a library, no matter how small they may be, serve a great cause: accretion of the national wealth.'
  work: Letter to S.P. Kuvshinnikova
  year: 1888
  detail: December 25, 1888
- text: Children are holy and pure. Even those of bandits and crocodiles belong among the angels.... They must not be turned into a plaything of one’s mood, first to be tenderly kissed, then rabidly stomped at.
  work: Letter to his brother, A.P. Chekhov
  year: 1889
  detail: January 2, 1889
- text: Of course politics is an interesting and engrossing thing. It offers no immutable laws, nearly always prevaricates, but as far as blather and sharpening the mind go, it provides inexhaustible material.
  work: Letter to A.S. Suvorin
  year: 1889
  detail: January 4, 1889
- text: In one-act pieces there should be only rubbish—that is their strength.
  work: Letter to A.S. Suvorin
  year: 1889
  detail: January 6, 1889
- text: Narrative prose is a legal wife, while drama is a posturing, boisterous, cheeky and wearisome mistress.
  work: Letter to A.N. Pleshcheev
  year: 1889
  detail: January 15, 1889
- text: Everything is good in due measure and strong sensations know not measure.
  work: Letter to N.M. Lintvareva
  year: 1889
  detail: February 11, 1889
- text: Lermontov died at age twenty-eight and wrote more than have you and I put together. Talent is recognizable not only by quality, but also by the quantity it yields.
  work: Letter to P.A. Sergeenko
  year: 1889
  detail: March 6, 1889
- text: Neither I nor anyone else knows what a standard is. We all recognize a dishonorable act, but have no idea what honor is.
  work: Letter to A.N. Pleshcheev
  year: 1889
  detail: April 9, 1889
- text: Brevity is the sister of talent.
  work: Letter to Alexander P. Chekhov
  year: 1889
  detail: April 11, 1889
- text: Everyone judges plays as if they were very easy to write. They don’t know that it is hard to write a good play, and twice as hard and tortuous to write a bad one.
  work: Letter to A.S. Suvorin
  year: 1889
  detail: May 4, 1889
- text: When performing an autopsy, even the most inveterate spiritualist would have to question where the soul is.
  work: Letter to A.S. Suvorin
  year: 1889
  detail: May 7, 1889
- text: Beware of exquisite language. The language should be simple and elegant.
  work: Letter to Alexander P. Chekhov
  year: 1889
  detail: May 8, 1889
- text: Life is difficult for those who have the daring to first set out on an unknown road. The avant-garde always has a bad time of it.
  work: Letter to A.S. Suvorin
  year: 1889
  detail: May 14, 1889
- text: 'When a person doesn’t understand something, he feels internal discord: however he doesn’t search for that discord in himself, as he should, but searches outside of himself. Thence a war develops with that which he doesn’t understand.'
  work: Letter to A.S. Suvorin
  year: 1889
  detail: May 15, 1889
- text: Without a knowledge of languages you feel as if you don’t have a passport.
  work: Letter to A.S. Suvorin
  year: 1889
  detail: November 1889
- text: Wherever there is degeneration and apathy, there also is sexual perversion, cold depravity, miscarriage, premature old age, grumbling youth, there is a decline in the arts, indifference to science, and injustice in all its forms.
  work: Letter to A.S. Suvorin
  year: 1889
  detail: December 27, 1889
- text: I drank so much in Peter[sburg] that Russia should be proud of me!
  work: Letter to A.S. Suvorin
  year: 1890
  detail: February 20, 1890
- text: In general, Russia suffers from a frightening poverty in the sphere of facts and a frightening wealth of all types of arguments.
  work: Letter to A.S. Suvorin
  year: 1890
  detail: February 23, 1890
- text: There are no lower or higher or median moralities. There is only one morality, and it is precisely the one that was given to us during the time of Jesus Christ and that stops me, you and Barantsevich from stealing, offending others, lying etc.
  work: Letter to I.L. Leontev
  year: 1890
  detail: March 22, 1890
- text: 'I divide all literary works into two categories: Those I like and those I don’t like. No other criterion exists for me.'
  work: Letter to I.L. Leontev
  year: 1890
  detail: March 22, 1890
- text: One can only call that youth healthful which refuses to be reconciled to old ways and which, foolishly or shrewdly, combats the old. This is nature’s charge and all progress hinges upon it.
  work: Letter to A.S. Suvorin
  year: 1890
  detail: March 29, 1890
- text: The world is a fine place. The only thing wrong with it is us. How little justice and humility there is in us, how poorly we understand patriotism!
  work: Letter to A.S. Suvorin
  year: 1890
  detail: December 9, 1890
- text: I think that it would be less difficult to live eternally than to be deprived of sleep throughout life.
  work: Letter to A.S. Suvorin
  year: 1890
  detail: December 9, 1890
- text: In my opinion it is harmful to place important things in the hands of philanthropy, which in Russia is marked by a chance character. Nor should important matters depend on leftovers, which are never there. I would prefer that the government treasury take care of it.
  work: Letter to A.S. Suvorin
  year: 1890
  detail: December 17, 1890
- text: One had better not rush, otherwise dung comes out rather than creative work.
  work: Letter to A.S. Suvorin
  year: 1891
  detail: August 18, 1891
- text: All great sages are as despotic as generals, and as ungracious and indelicate as generals, because they are confident of their impunity.
  work: Letter to A.S. Suvorin
  year: 1891
  detail: September 8, 1891
- text: He who constantly swims in the ocean loves dry land.
  work: Letter to E.M. Shavrova
  year: 1891
  detail: September 16, 1891
- text: We old bachelors smell like dogs, do we? So be it. But I must take issue with your claim that doctors who treat female illnesses are womanizers and cynics at heart. Gynecologists deal with savage prose the likes of which you have never dreamed of.
