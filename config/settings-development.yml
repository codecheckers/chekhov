# Chekhov — development configuration
#
# Everything here points at the TESTING register, never the production one:
#   https://github.com/codecheckers/testing-dev-register
#
# Schema follows buffy (openjournals/buffy, config/settings-development.yml) so
# that adopting buffy as the engine stays a configuration change rather than a
# rewrite. If a fresh implementation wins instead, this file is still the
# single place that names the target repository and the commands.
#
# `${VAR:-default}` is expanded from the environment when the file is read, see
# settings.go. buffy writes ERB here; this is the same idea in a form Go can
# read without running Ruby.
chekhov:
  env:
    bot_github_user: ${CHEKHOV_BOT_GH_USER:-chekhovbot}
    # Target repository for all development and testing. Do NOT point this at
    # codecheckers/register.
    target_repository: ${CHEKHOV_TARGET_REPO:-codecheckers/testing-dev-register}
    # Columns of register.csv in the target repo:
    # Certificate,Repository,Type,Venue,Issue
    register_file: register.csv
    # The published certificate, {id} is the certificate identifier. The page
    # has index.json and cert_1.png, cert_2.png, ... next to it.
    certificates: https://codecheck.org.uk/testing-dev-register/{id}/
    # The codechecker lists, read for fediverse accounts after persons.csv.
    # persons.csv and venues.csv are read from the target repository.
    codechecker_lists:
      - https://raw.githubusercontent.com/${CHEKHOV_TARGET_REPO:-codecheckers/testing-dev-register}/HEAD/codecheckers.csv
      - https://raw.githubusercontent.com/${CHEKHOV_TARGET_REPO:-codecheckers/testing-dev-register}/HEAD/institutional-codecheckers.csv

  mastodon:
    # Where "@chekhovbot announce" toots. The token is CHEKHOV_MASTODON_TOKEN;
    # without it announcing is switched off. See docs/deployment.md.
    instance: ${CHEKHOV_MASTODON_INSTANCE:-https://fediscience.org}
    # The account the token must belong to, without @ or instance. A token of
    # any other account is refused before anything is posted.
    account: ${CHEKHOV_MASTODON_ACCOUNT:-codecheck}
    # Development posts direct messages only, and with direct visibility every
    # mention is defused, so no real person is ever notified. A test asserts it.
    visibility: direct
    # Following an account, and requesting it for a public collection, is a
    # real, visible act that direct visibility does not soften - so it stays
    # off here, whatever the token's scopes allow. A test asserts it.
    follow: false

  teams:
    # The standing roles come from the organisation's own teams, read with the
    # token's Members: read permission and held in memory for a day. This file
    # names teams, not people: membership is maintained in one place, by the
    # organisation, rather than in a second list here. A team that cannot be
    # read means nobody holds that role - never that everybody does.
    organisation: ${CHEKHOV_TEAMS_ORG:-codecheckers}
    editors: editors
    codecheckers: codecheckers

  # Who may run a command is NOT here: it is the Role of the command's entry in
  # internal/command/registry.go, which also generates the help listing. buffy
  # writes `only: editors` under a responder; this file used to carry that and
  # nothing read it, which is two places able to disagree about who may run
  # what. The registry decides, alone.
  responders:
    help:
    hello:
      hidden: true
    welcome:
      message: "Hi! I'm @chekhovbot. If the research paper has code, it must run.\n\nType ```@chekhovbot commands``` to see how I can help."
    assign_codechecker:
    check_config:
      # Validate codecheck.yml early, rather than at render time
      config_file: codecheck.yml
    register:
      # Open the PR adding a row to register.csv
