# Chekhov — development configuration
#
# Everything here points at the TESTING register, never the production one:
#   https://github.com/codecheckers/testing-dev-register
#
# Schema follows buffy (openjournals/buffy, config/settings-development.yml) so
# that adopting buffy as the engine stays a configuration change rather than a
# rewrite. If a fresh implementation wins instead, this file is still the
# single place that names the target repository and the commands.
#
# `${VAR:-default}` is expanded from the environment when the file is read, see
# settings.go. buffy writes ERB here; this is the same idea in a form Go can
# read without running Ruby.
chekhov:
  env:
    bot_github_user: ${CHEKHOV_BOT_GH_USER:-chekhovbot}
    # Target repository for all development and testing. Do NOT point this at
    # codecheckers/register.
    target_repository: ${CHEKHOV_TARGET_REPO:-codecheckers/testing-dev-register}
    # Columns of register.csv in the target repo:
    # Certificate,Repository,Type,Venue,Issue
    register_file: register.csv
    # The published certificate, {id} is the certificate identifier. The page
    # has index.json and cert_1.png, cert_2.png, ... next to it.
    certificates: https://codecheck.org.uk/testing-dev-register/{id}/
    # The codechecker lists, read for fediverse accounts after persons.csv.
    # persons.csv and venues.csv are read from the target repository.
    codechecker_lists:
      - https://raw.githubusercontent.com/${CHEKHOV_TARGET_REPO:-codecheckers/testing-dev-register}/HEAD/codecheckers.csv
      - https://raw.githubusercontent.com/${CHEKHOV_TARGET_REPO:-codecheckers/testing-dev-register}/HEAD/institutional-codecheckers.csv
    # The issue of the target repository a command's panic is reported on, 0
    # for the log only; see docs/deployment.md. Quoted, so "#42" is refused.
    admin_issue: "${CHEKHOV_ADMIN_ISSUE:-0}"

  metadata:
    # Where the bot asks what a paper is: its title, its authors and what it is
    # about. "openalex" or "crossref"; see config/settings.go for why OpenAlex
    # is the default. Crossref is still implemented and one word away.
    source: ${CHEKHOV_METADATA_SOURCE:-openalex}
    # OpenAlex asks callers to identify themselves, and puts those who do in a
    # faster pool. A project address, never a person's.
    mailto: ${CHEKHOV_METADATA_MAILTO:-chekhov@cdchck.science}

  links:
    # Sites `check links` does not ask, because they refuse an automated
    # request - or answer it with a login page - whatever the link is, so the
    # answer would say "blocked" and nothing about the link. A link to one is
    # reported as not checked. A host covers its subdomains.
    skip_hosts:
      # Log-in walls and bot challenges for anything without a session.
      - linkedin.com
      - researchgate.net
      - x.com
      - twitter.com
      - facebook.com
      - instagram.com
      # Answers every client it does not recognise with 403.
      - sciencedirect.com
      - academic.oup.com
      - onlinelibrary.wiley.com
      - tandfonline.com
    # The largest certificate source read for links, in bytes. A notebook with
    # its figure outputs embedded runs to tens of megabytes; its links are in
    # the text. At most 8 MiB, which is as much of any response as the bot
    # reads. The size is checked before downloading where the repository's
    # listing says it.
    max_certificate_bytes: ${CHEKHOV_LINKS_MAX_CERTIFICATE_BYTES:-5242880}

  mastodon:
    # Where "@chekhovbot announce" toots. The token is CHEKHOV_MASTODON_TOKEN;
    # without it announcing is switched off. See docs/deployment.md.
    instance: ${CHEKHOV_MASTODON_INSTANCE:-https://fediscience.org}
    # The account the token must belong to, without @ or instance. A token of
    # any other account is refused before anything is posted.
    account: ${CHEKHOV_MASTODON_ACCOUNT:-codecheck}
    # Development posts direct messages only, and with direct visibility every
    # mention is defused, so no real person is ever notified. A test asserts it.
    visibility: direct
    # Following an account, and requesting it for a public collection, is a
    # real, visible act that direct visibility does not soften - so it stays
    # off here, whatever the token's scopes allow. A test asserts it.
    follow: false

  # The register's own labels, which say things about a check the bot can
  # compare against what it can see. The names belong to the register, not to
  # this bot, so they are named here rather than written into the code: a
  # register that renames one needs a settings change, not a new build. The
  # bot reports a label that no longer describes the check, and changes a
  # label only where `managed` below allows it. An empty name switches off
  # what would have been said or done about it.
  labels:
    # "CODECHECK conducted as part of a service offered by an institution."
    institution: institution
    # The queue: a check nobody is doing yet.
    needs_codechecker: needs codechecker
    # A check holding a certificate identifier, in its title: what
    # `certificate next` counts and `certificate set` puts on.
    id_assigned: id assigned
    # A codechecker is assigned and working on the check: what `check start`
    # puts on and `check finish` takes off again, so the bot needs both an
    # add and a remove below. A register that withholds either is not refused
    # at load - the commands say in the reply which label they left alone.
    work_in_progress: work in progress
    # The check is finished but something it needs is not settled - a DOI
    # still a placeholder, most often - so `check finish` leaves this on
    # instead of clearing the workflow labels.
    metadata_pending: metadata pending
    # What the bot may do to labels itself, by name - as teams.managed is for
    # teams. A label in neither list is only ever read.
    managed:
      add: [id assigned, work in progress, metadata pending]
      remove: [needs codechecker, work in progress, metadata pending]

  teams:
    # The standing roles come from the organisation's own teams, read with the
    # token's Members: read permission and held in memory for a day. This file
    # names teams, not people: membership is maintained in one place, by the
    # organisation, rather than in a second list here. A team that cannot be
    # read means nobody holds that role - never that everybody does.
    organisation: ${CHEKHOV_TEAMS_ORG:-codecheckers}
    editors: editors
    codecheckers: codecheckers
    # Where a codechecker on a check an institution's arrangement covers
    # belongs. Named, rather than picked out of the list below by the shape of
    # its name.
    institutional: institutional-codecheckers
    # Who to ask when somebody has to be invited to the organisation. Only an
    # organisation owner can do that, so the reply mentions them - the one
    # place this bot writes a plain @mention, which notifies. In development
    # that must not be the real owners: a test may not notify people who did
    # not ask to be in it. Left empty in production, where the organisation's
    # own owners are read and asked.
    owners:
      - nuest
    # The teams the bot may add somebody to. Which one a codechecker belongs
    # in follows from the check: an institutional check belongs in the
    # institutional team. The editors team must never appear here - the bot
    # would then be able to grant the permission its own editor commands are
    # gated on - and the settings are refused at load if it does.
    managed:
      - codecheckers
      - institutional-codecheckers

  # The codechecker lists, where people register as codecheckers: a second
  # repository the bot answers on, to a registration issue and nothing else
  # (codecheckers/chekhov#49). Only the production file may name
  # codecheckers/codecheckers; the settings are refused otherwise. An empty
  # CHEKHOV_LISTS_REPO falls back to the default below, so switching the lists
  # off is an empty `repository:` here, in a build of its own.
  lists:
    repository: ${CHEKHOV_LISTS_REPO:-codecheckers/testing-dev-codecheckers}
    # The label the registration template puts on its issue.
    registration_label: registration
    # Whom `include` asks to review the pull request adding a row: "asker",
    # the editor who ran it, when empty; "owners"; "editors"; or one or more
    # handles, e.g. a community manager. Never the registrant (#49).
    reviewers: []
    # Compared with a registration, to say whether somebody is listed already.
    files:
      - https://raw.githubusercontent.com/${CHEKHOV_LISTS_REPO:-codecheckers/testing-dev-codecheckers}/HEAD/codecheckers.csv
      - https://raw.githubusercontent.com/${CHEKHOV_LISTS_REPO:-codecheckers/testing-dev-codecheckers}/HEAD/institutional-codecheckers.csv
      - https://raw.githubusercontent.com/${CHEKHOV_LISTS_REPO:-codecheckers/testing-dev-codecheckers}/HEAD/agile-codecheckers.csv

  # The sweep's own comments about a check that has stalled - not the
  # follow-ups an earlier reply asked for, which come whatever this says.
  # Each threshold is in days, and 0 switches it off, which is the default:
  # editors switch a nudge on by setting it on the deployment. See
  # codecheckers/chekhov#25.
  nudges:
    # A check with an assigned codechecker and no comment for this long: the
    # codechecker is asked where it stands.
    quiet_days: ${CHEKHOV_NUDGE_QUIET_DAYS:-0}
    # A check carrying the needs_codechecker label for this long: the editors
    # are told. Here that means the people in teams.owners, never the
    # editors team, for the reason owners are named there.
    needs_codechecker_days: ${CHEKHOV_NUDGE_NEEDS_CODECHECKER_DAYS:-0}
    # How many nudges one sweep posts at most; the rest wait a night.
    most_per_sweep: ${CHEKHOV_NUDGE_MOST_PER_SWEEP:-5}
    # The only issues nudged, comma-separated. Required here once a nudge is
    # on - the settings are refused without it - because the testing
    # register is two hundred issues of test debris, and a live test names
    # the issue it tries nudges on.
    only_issues: "${CHEKHOV_NUDGE_ONLY_ISSUES:-}"

  # Who may run a command is NOT here: it is the Role of the command's entry in
  # internal/command/registry.go, which also generates the help listing. buffy
  # writes `only: editors` under a responder; this file used to carry that and
  # nothing read it, which is two places able to disagree about who may run
  # what. The registry decides, alone.
  responders:
    help:
    hello:
      hidden: true
    welcome:
      message: "Hi! I'm @chekhovbot. If the research paper has code, it must run.\n\nType ```@chekhovbot commands``` to see how I can help."
    assign_codechecker:
    check_config:
      # Validate codecheck.yml early, rather than at render time
      config_file: codecheck.yml
    register:
      # Open the PR adding a row to register.csv
