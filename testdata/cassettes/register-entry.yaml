        body: '{"status":"ok","message-type":"work","message-version":"1.0.0","message":{"indexed":{"date-parts":[[2026,9,12]],"date-time":"2026-09-12T22:49:08Z","timestamp":1789253348044,"version":"build-2803163510"},"posted":{"date-parts":[[2025,10,30]]},"group-title":"Wind technologies\/Airborne technology","reference-count":0,"publisher":"Copernicus GmbH","license":[{"start":{"date-parts":[[2025,10,30]],"date-time":"2025-10-30T00:00:00Z","timestamp":1761782400000},"content-version":"vor","delay-in-days":0,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/"}],"funder":[{"DOI":"10.13039\/100010661","name":"Horizon 2020 Framework Programme","doi-asserted-by":"publisher","award":["101084216"],"award-info":[{"award-number":["101084216"]}],"id":[{"id":"10.13039\/100010661","id-type":"DOI","asserted-by":"publisher"}]},{"DOI":"10.13039\/501100003246","name":"Nederlandse Organisatie voor Wetenschappelijk Onderzoek","doi-asserted-by":"publisher","award":["17628"],"award-info":[{"award-number":["17628"]}],"id":[{"id":"10.13039\/501100003246","id-type":"DOI","asserted-by":"publisher"}]}],"content-domain":{"domain":[],"crossmark-restriction":false},"short-container-title":[],"abstract":"<jats:p>Abstract. Leading-edge inflatable (LEI) kites are characterized by a pronounced downward curvature of the wing and flow recirculation zones on the pressure side. This study presents novel stereoscopic particle image velocimetry (PIV) measurements of a 1:6.5 rigid scale model of the TU Delft V3 LEI kite. The flow-field measurements were conducted in the Open Jet Facility of Delft University of Technology for two angles of attack and seven chordwise measurement planes positioned between mid-span and tip, and were compared with results from Reynolds-averaged Navier\u2013Stokes (RANS) simulations. The double-curved anhedral wing geometry presented several challenges, such as surface reflections that required careful data processing and the use of a lateral velocity filter. The circulation distribution was analyzed, using both elliptical and rectangular boundary curves, showing good agreement in trends between the vortex-step method (VSM), RANS, and PIV data. The lift and drag coefficients of each chordwise measurement plane were estimated using the Kutta\u2013Joukowski theorem, surface pressure integration of RANS CFD data, and Noca''s method \u2013 an inherently three-dimensional reformulation of the momentum conservation equations expressed solely as surface integrals over the control-volume boundary \u2013 applied here in two dimensions. While the mid-span to tip variation of lift coefficients was in accordance with the anhedral shape and tip-vortex effects, the drag measurements and predictions deviated from the expected behavior by exhibiting negative values. Especially near the tip region, significant discrepancies were observed, attributed to increased measurement uncertainty. The surface pressure integration revealed discrepancies at the strut junction, likely due to local three-dimensional strut-induced flow effects and increased airfoil thickness. This study provides comprehensive validation data for CFD simulations of LEI kites while highlighting the challenges in PIV measurements of double-curved anhedral wings and characterizing local aerodynamic phenomena.<\/jats:p>","DOI":"10.5194\/wes-2025-217","type":"posted-content","created":{"date-parts":[[2025,10,30]],"date-time":"2025-10-30T12:41:37Z","timestamp":1761828097000},"source":"Crossref","is-referenced-by-count":1,"title":["Flow Field Analysis of a Leading-Edge Inflatable Kite Rigid Scale Model Using Stereoscopic Particle Image Velocimetry"],"prefix":"10.5194","author":[{"ORCID":"https:\/\/orcid.org\/0000-0003-3164-5648","authenticated-orcid":false,"given":"Jelle Agatho Wilhelm","family":"Poland","sequence":"first","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]},{"ORCID":"https:\/\/orcid.org\/0000-0003-1486-3643","authenticated-orcid":false,"given":"Erik","family":"Fritz","sequence":"additional","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]},{"ORCID":"https:\/\/orcid.org\/0000-0002-4112-841X","authenticated-orcid":false,"given":"Roland","family":"Schmehl","sequence":"additional","affiliation":[],"role":[{"vocabulary":"crossref","role":"author"}]}],"member":"3145","container-title":[],"original-title":[],"deposited":{"date-parts":[[2026,5,26]],"date-time":"2026-05-26T10:07:33Z","timestamp":1779790053000},"score":1,"resource":{"primary":{"URL":"https:\/\/wes.copernicus.org\/articles\/11\/1461\/2026\/wes-11-1461-2026-discussion.html"}},"subtitle":[],"short-title":[],"issued":{"date-parts":[[2025,10,30]]},"references-count":0,"URL":"https:\/\/doi.org\/10.5194\/wes-2025-217","relation":{"has-comment":[{"id-type":"doi","id":"10.5194\/wes-2025-217-AC2","asserted-by":"subject"},{"id-type":"doi","id":"10.5194\/wes-2025-217-AC1","asserted-by":"subject"}],"has-review":[{"id-type":"doi","id":"10.5194\/wes-2025-217-RC1","asserted-by":"subject"},{"id-type":"doi","id":"10.5194\/wes-2025-217-RC2","asserted-by":"subject"}],"is-preprint-of":[{"id-type":"doi","id":"10.5194\/wes-11-1461-2026","asserted-by":"subject"},{"id-type":"doi","id":"10.5194\/wes-11-1461-2026","asserted-by":"object"}]},"subject":[],"published":{"date-parts":[[2025,10,30]]},"subtype":"preprint"}}'
