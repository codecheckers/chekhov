        content_length: -1
        uncompressed: true
        body: '{"last-modified-date":{"value":1784863168555},"name":{"created-date":{"value":1460759031136},"last-modified-date":{"value":1460759031136},"given-names":{"value":"Roland"},"family-name":{"value":"Schmehl"},"credit-name":null,"source":null,"visibility":"public","path":"0000-0002-4112-841X"},"other-names":{"last-modified-date":{"value":1607431158718},"other-name":[{"created-date":{"value":1607431158718},"last-modified-date":{"value":1607431158718},"source":{"source-orcid":{"uri":"https://orcid.org/0000-0002-4112-841X","path":"0000-0002-4112-841X","host":"orcid.org"},"source-client-id":null,"source-name":{"value":"Roland Schmehl"},"assertion-origin-orcid":null,"assertion-origin-client-id":null,"assertion-origin-name":null},"content":"R. Schmehl","visibility":"public","path":"/0000-0002-4112-841X/other-names/1525658","put-code":1525658,"display-index":1}],"path":"/0000-0002-4112-841X/other-names"},"biography":{"created-date":{"value":1460759031138},"last-modified-date":{"value":1725537124710},"content":"Roland Schmehl graduated in Mechanical Engineering from Karlsruhe University. In 2003, he received a PhD for his research on computational modeling of multi-phase flows and liquid droplet dynamics. During his post-doctoral research at the European Space Agency (ESA), he investigated, among others, the start-up behavior of the hypergolic upper-stage engine of the European launcher Ariane 5. He then worked as a software architect for TNO Automotive Safety Solutions, developing fluid dynamic simulation methods for airbag deployment. In 2009, he became associate professor and head of the Kite Power research group at the faculty for Aerospace Engineering of Delft University of Technology. Next to leading a pioneering development team, his research focus is on the fluid dynamic, structural dynamic and flight dynamic modeling of airborne wind energy systems. In 2013 he co-edited the first textbook on airborne wind energy, published by Springer, with 35 contributed chapters on 611 pages. From 2015-2018 he coordinated the Marie Skłodowska-Curie doctoral training network AWESCO and from 2015-2019 the \"Fast Track to Innovation\" project REACH, both focusing entirely on the advancement of airborne wind energy within the European framework program Horizon 2020. He co-organized the International Airborne Wind Energy Conferences (AWEC) in Delft (2015), Freiburg (2017) and Glasgow (2019). In 2016, he and Johannes Peschel co-founded the university spin-off company Kitepower BV to commercially develop a 100 kW kite power system. In 2018 he edited the second textbook on airborne wind energy, published by Springer, with 30 contributed chapters on 752 pages. He is the author of 115 scientific publications.","visibility":"public","path":"/0000-0002-4112-841X/biography"},"researcher-urls":{"last-modified-date":{"value":1784863168555},"researcher-url":[{"created-date":{"value":1443094985262},"last-modified-date":{"value":1725537026612},"source":{"source-orcid":{"uri":"https://orcid.org/0000-0002-4112-841X","path":"0000-0002-4112-841X","host":"orcid.org"},"source-client-id":null,"source-name":{"value":"Roland Schmehl"},"assertion-origin-orcid":null,"assertion-origin-client-id":null,"assertion-origin-name":null},"url-name":"Staff page TU Delft","url":{"value":"https://www.tudelft.nl/staff/r.schmehl/"},"visibility":"public","path":"/0000-0002-4112-841X/researcher-urls/538388","put-code":538388,"display-index":6},{"created-date":{"value":1725536870424},"last-modified-date":{"value":1725537026612},"source":{"source-orcid":{"uri":"https://orcid.org/0000-0002-4112-841X","path":"0000-0002-4112-841X","host":"orcid.org"},"source-client-id":null,"source-name":{"value":"Roland Schmehl"},"assertion-origin-orcid":null,"assertion-origin-client-id":null,"assertion-origin-name":null},"url-name":"Research portal TU Delft","url":{"value":"https://research.tudelft.nl/en/persons/r-schmehl"},"visibility":"public","path":"/0000-0002-4112-841X/researcher-urls/4854