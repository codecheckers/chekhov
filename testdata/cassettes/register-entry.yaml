        body: '{"created": "2026-03-09T13:07:42.277005+00:00", "modified": "2026-03-09T13:07:42.659900+00:00", "id": 18890103, "conceptrecid": "18890102", "doi": "10.5281/zenodo.18890103", "conceptdoi": "10.5281/zenodo.18890102", "doi_url": "https://doi.org/10.5281/zenodo.18890103", "metadata": {"title": "CODECHECK Certificate 2026-001", "doi": "10.5281/zenodo.18890103", "publication_date": "2026-03-06", "description": "<p>CODECHECK certificate for publication <a href=\"https://doi.org/10.5194/wes-2025-217\"><span lang=\"EN-US\">Flow Field Analysis of a Leading-Edge Inflatable Kite Rigid Scale Model Using Stereoscopic Particle Image Velocimetry</span></a>.</p>\n<p><span lang=\"EN-US\">This codecheck resulted in a partial reproduction of the figures presented in the publication. The authors provided a GitHub repository containing all the necessary code and instructions for reproducing the figures. </span></p>\n<p><span lang=\"EN-US\">Given the runtime of the program is approximately 21 hours, the code was executed on an HPC cluster. Two minor changes were made to the code: 1) the NumPy function &ldquo;trapz&rdquo; was renamed &ldquo;trapezoid&rdquo;, and 2) LaTeX rendering was disabled, as suggested by the author, since it was not available on the HPC system used.</span></p>", "access_right": "open", "creators": [{"name": "Grguric, Josip", "affiliation": "Delft University of Technology", "orcid": "0009-0003-3725-9454"}, {"name": "Quintero, Yasel", "affiliation": "Delft University of Technology", "orcid": "0009-0005-9240-7370"}], "related_identifiers": [{"identifier": "10.5194/wes-2025-217", "relation": "reviews", "resource_type": "publication", "scheme": "doi"}, {"identifier": "https://github.com/codecheckers/kite_piv_analysis", "relation": "isDerivedFrom", "resource_type": "software", "scheme": "url"}], "language": "eng", "resource_type": {"title": "Report", "type": "publication", "subtype": "report"}, "alternate_identifiers": [{"identifier": "http://cdchck.science/